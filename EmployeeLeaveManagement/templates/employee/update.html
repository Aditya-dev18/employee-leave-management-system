{% extends "base.html" %}

{% block title %}{{ title|default:"Update Employee" }}{% endblock %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-header bg-white">
        <h1 class="h4 mb-0">{{ title|default:"Update Employee" }}</h1>
    </div>
    <div class="card-body">
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Save Changes</button>
            {% if back_url %}
            <a href="{% url back_url %}" class="btn btn-secondary">Back</a>
            {% else %}
            <a href="{% url 'employee_list' %}" class="btn btn-secondary">Back</a>
            {% endif %}
        </form>
    </div>
</div>
{% endblock %}
